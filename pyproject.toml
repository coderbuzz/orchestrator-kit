[project]
name = "orchestrator-kit"
version = "0.2.0"
description = "Multi-agent orchestrator for Claude Code: an AI organization defined in Git, generated as a Claude Code plugin with guardrails"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["claude-code", "multi-agent", "orchestrator", "agents", "mcp"]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.urls]
Repository = "https://github.com/coderbuzz/orchestrator-kit"

[project.scripts]
orchestrator-kit = "orchestrator_kit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["orchestrator_kit"]

[tool.setuptools.package-data]
orchestrator_kit = ["schemas/**/*.json", "schemas/**/*.yaml", "library/**/*"]
