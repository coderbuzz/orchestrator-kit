[project]
name = "orchestrator-kit"
version = "0.2.0"
description = "Run an AI organization from definitions in Git: company catalog, project rosters, harness routing, guardrails, plugin generator"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.scripts]
orchestrator-kit = "orchestrator_kit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["orchestrator_kit"]

[tool.setuptools.package-data]
orchestrator_kit = ["schemas/**/*.json", "schemas/**/*.yaml", "library/**/*"]
