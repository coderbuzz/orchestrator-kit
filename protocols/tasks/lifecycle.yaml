# Deterministic task state machine. Phase-2 orchestrator must enforce exactly these transitions.
# Test: tests/contracts/test_lifecycle.py keeps this in sync with task.schema.json.
version: 1.1.0
initial: PENDING
terminal: [COMPLETED, FAILED, CANCELLED]
transitions:
  PENDING: [PLANNED, CANCELLED]
  PLANNED: [RUNNING, BLOCKED, CANCELLED]
  RUNNING: [PLANNED, BLOCKED, WAITING_APPROVAL, COMPLETED, FAILED, CANCELLED]   # -> PLANNED = retry / reassign / recovery
  BLOCKED: [PLANNED, RUNNING, FAILED, CANCELLED]
  WAITING_APPROVAL: [RUNNING, PLANNED, FAILED, CANCELLED]   # granted -> RUNNING, rejected -> FAILED or CANCELLED
  COMPLETED: []
  FAILED: []
  CANCELLED: []
guards:
  COMPLETED: "task.evidence is non-empty and every required_artifacts type is present among evidence artifacts"
  WAITING_APPROVAL: "an ApprovalRequested event exists for the task"
