id: orchestration
name: Orchestration
description: Runs the company from an orchestrator session - turns directives into tasks, has native subagents or worker harnesses do them, and moves every task through the company tools that enforce evidence, approvals and budgets.
version: 1.2.0
purpose: 'The CEO decides what happens; the company tools (MCP server `company`) refuse what must not happen. This skill is the operating loop between the two: plan as tasks, execute each task with the right agent and AI selection, react to every outcome, and stop when the objective is evidenced or the budget says stop.'
inputs:
- Board directive or open objective, and the project it concerns (`projects`)
- company state and open tasks of that project (`status`, `tasks`)
- subagents (one per agent) and their skills
outputs: [plan, decision_record, board_report]
preconditions:
- The project has a company.yaml (`projects`); otherwise agree a daily budget with the Board and `project_init` it.
- A budget is known for the objective; if not, ask the Board one question with a recommended budget.
procedure:
- 'Orient: `status` and `tasks` for the project; finish or cancel stale work before starting new work.'
- Converse and read on the conversation model; decide on the strongest. Status, data, summaries and questions are answered in the conversation (`status`, `tasks`, `usage`, board-reporting). Every decision of the CEO is a task assigned to `ceo` that `task_start` sends to the `ceo-decision` subagent (strongest model), never taken in the conversation, even when the answer looks obvious.
- 'Interpret the directive: STATUS or a plain question -> answer, no tasks. Anything else -> a decision task for ceo (skill directive-interpretation, `options` = the intents) and follow its decision. MARKET_DISCOVERY or EVALUATE -> follow the market-discovery skill. STOP/PAUSE/RESUME/PRIORITIZE -> cancel or re-plan the affected tasks; a live product''s stage change is the Board''s (`board_product_stage` after the Board decides), so ask. Anything else -> plan with company-planning: a task for ceo (skill company-planning, artifact plan) whose `plan` you turn into `task_add` calls.'
- Create every task with `task_add` (agent, objective, criteria, skill or artifacts, after, budget_usd, ai, inputs.workdir for work inside a project repo). One agent and one skill per task, explicit dependencies, a budget. Keep a plan to 15 tasks or fewer and put a decision task (`options`) at each point where the evidence decides the next step.
- 'Choose the AI per task only when it matters: a cheap model for triage and formatting, the strongest model and high effort for decisions and hard analysis, a worker harness (e.g. zcode) when its model or provider is wanted. Pass it as `ai: {harness, provider, model, effort}`; the tool refuses a selection the harness cannot honour.'
- 'Run every task whose dependencies are COMPLETED, independent ones in parallel. Pick the path from the task's resolved AI: harness claude-code (or none) takes the subagent path; any other harness (zcode, agy, dsh) takes the worker path, and `task_start` refuses it. Subagent path: `task_start` (returns `subagent_prompt`), then call the subagent named after the task''s agent with that prompt and pass its JSON to `task_submit`. Worker path: `dispatch` straight after `task_add` (never `task_start` first) when the task''s AI names another harness or a model/effort a native subagent cannot take.'
- 'React to the submit outcome. COMPLETED: use its artifacts downstream. PLANNED (verification failed, attempts left): read the notes; start it again with the feedback, or cancel it and add a better-scoped task, another agent, or a stronger model. WAITING_APPROVAL: if the approver is an agent, have that agent''s subagent review the request with approval-review and record its verdict with `review`; if the approver is the Board, tell the Board and keep other work moving; record the Board''s decision with `board_decide` only after the Board decided it in the conversation. FAILED or BLOCKED: a decision task for ceo - a new task, a smaller scope, or one clear question to the Board.'
- Decision tasks use executive-decision and run in `ceo-decision`; record the decision through `task_submit` (the tool checks the option is allowed). Notify the Board of level-3 decisions with a notify_board action in the result, and tell the Board in plain words what was decided and why.
- Stop when the objective's evidence exists (accepted artifacts, recorded decision, product stage), when the objective's budget is spent, or when the same question failed twice; never loop a failing task past its attempts.
- 'Report to the Board with board-reporting: outcomes, cost against budget, risks, decisions needed, next steps. No task logs.'
validation:
- Every decision of the CEO was taken by a task assigned to ceo (subagent ceo-decision), none in the conversation.
- Every task went through `task_add` and ended through `task_submit`, `review`, `board_decide` or `task_close`; no file under .company/ was edited directly.
- Every completed objective cites accepted artifacts or a recorded decision, not a task status.
- Every approval was resolved by its approver agent's review verdict or by the Board; never by the requester.
- Spend stayed within the objective's budget and the daily cap (`usage`).
failure_modes:
- mode: The conversation is tempted to answer a decision question itself
  handling: Create the decision task and run it through ceo-decision; the conversation only relays the result.
- mode: ceo-decision is unavailable (limit or error)
  handling: Say so, keep unrelated work moving and wait; never decide on the conversation model.
- mode: A tool refuses an operation
  handling: Read the reason; fix the plan (dependency, skill, budget, AI selection) instead of working around the guardrail.
- mode: A subagent returns prose instead of the agent-result JSON
  handling: Ask it once more for only the JSON; if it fails again, submit status failed with its summary so the attempt is counted.
- mode: Approval pending with the Board
  handling: Continue unrelated tasks; mention the approval id in the Board report.
- mode: Daily cap reached
  handling: Stop dispatching; continue only native work that costs nothing extra, or report and wait.
required_capabilities: [create_task, record_decision, request_approval, notify_board]
